name: Semantic search on Windows

# A heavy check: it downloads Ollama (1.5 GB) and the bge-m3 model (1.2 GB). Runs only by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ollama:
    name: Windows · Ollama, the bge-m3 model and search by meaning
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Ollama — the official Windows build
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ollama.zip"
          curl.exe -fsSL -o $zip https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = "$env:RUNNER_TEMP\ollama"
          New-Item -ItemType Directory -Path $dir | Out-Null
          tar -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -LiteralPath $zip
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\ollama.exe" --version
          Get-ChildItem $dir | ForEach-Object { $_.Name }

      - name: install.cmd — starts Ollama and downloads the model by itself
        shell: cmd
        run: call install.cmd --no-pause --no-history > "%RUNNER_TEMP%\install.log" 2>&1

      - name: Install log
        if: always()
        shell: pwsh
        run: Get-Content -LiteralPath "$env:RUNNER_TEMP\install.log" -Encoding utf8 | Where-Object { $_ -notmatch 'pulling [0-9a-f]{8}' }

      - name: Live checks with search by meaning
        shell: pwsh
        run: python tests\live_checks.py installed --lang en --memory-home "$env:USERPROFILE\.codex-memory" --codex-home "$env:USERPROFILE\.codex" --install-log "$env:RUNNER_TEMP\install.log" --expect-schedule --expect-embeddings

      - name: Memory and Ollama logs
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "$env:USERPROFILE\.codex-memory\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            "----- $($_.Name)"
            Get-Content -LiteralPath $_.FullName -Encoding utf8 -Tail 25
          }

      - name: uninstall.cmd
        shell: cmd
        run: call "%USERPROFILE%\.codex-memory\uninstall.cmd" --no-pause

      - name: Checks after removal
        shell: pwsh
        run: python tests\live_checks.py removed --memory-home "$env:USERPROFILE\.codex-memory" --codex-home "$env:USERPROFILE\.codex"

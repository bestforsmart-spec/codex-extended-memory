name: Install check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-zip:
    name: Windows · install.cmd from the archive, language from the system
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: System
        shell: pwsh
        continue-on-error: true
        run: |
          (Get-CimInstance Win32_OperatingSystem).Caption
          chcp
          python --version
          py -0p

      - name: Codex CLI (so that real Codex validates the settings)
        shell: pwsh
        continue-on-error: true
        run: |
          npm install -g @openai/codex
          if ($LASTEXITCODE -ne 0) { exit 1 }
          codex --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CODEX_OK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Static checks
        shell: pwsh
        run: python tests\win_checks.py . "$env:RUNNER_TEMP\unit"

      - name: Translation checks
        shell: pwsh
        run: python tests\i18n_checks.py .

      - name: Build the archive and unpack it the way a user would
        shell: pwsh
        run: |
          python tools\build_zip.py . "$env:RUNNER_TEMP\codex-extended-memory.zip"
          $dest = Join-Path $env:USERPROFILE 'Downloads\codex-extended-memory-v1.2.0 (1)'
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\codex-extended-memory.zip" -DestinationPath $dest
          Get-ChildItem -Recurse -File $dest | ForEach-Object { $_.FullName }
          "PKG=$dest\codex-extended-memory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fake Codex session (to check the history import)
        shell: pwsh
        run: python tests\live_checks.py prepare --codex-home "$env:USERPROFILE\.codex"

      - name: install.cmd
        shell: cmd
        run: |
          call "%PKG%\install.cmd" --no-pause > "%RUNNER_TEMP%\install.log" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\install.log"
          exit /b %RC%

      - name: Live checks (English expected on an English system)
        shell: pwsh
        run: |
          $checks = @('tests\live_checks.py', 'installed', '--lang', 'en',
                      '--memory-home', "$env:USERPROFILE\.codex-memory",
                      '--codex-home', "$env:USERPROFILE\.codex",
                      '--install-log', "$env:RUNNER_TEMP\install.log",
                      '--expect-schedule', '--expect-history')
          if ($env:CODEX_OK -eq '1') { $checks += '--expect-codex' }
          python @checks

      - name: Install again over the top (data stays untouched)
        shell: cmd
        run: |
          call "%PKG%\install.cmd" --no-pause --no-history > "%RUNNER_TEMP%\install2.log" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\install2.log"
          exit /b %RC%

      - name: uninstall.cmd
        shell: cmd
        run: call "%USERPROFILE%\.codex-memory\uninstall.cmd" --no-pause

      - name: Checks after removal
        shell: pwsh
        run: python tests\live_checks.py removed --memory-home "$env:USERPROFILE\.codex-memory" --codex-home "$env:USERPROFILE\.codex"

      - name: Memory logs
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "$env:USERPROFILE\.codex-memory\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            "----- $($_.Name)"
            Get-Content -LiteralPath $_.FullName -Encoding utf8 -Tail 40
          }

  windows-python:
    name: Windows · Python ${{ matrix.python }}, Russian, paths with Cyrillic and spaces
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Folders with Cyrillic and spaces
        shell: pwsh
        run: |
          $base = Join-Path $env:USERPROFILE 'Мои заметки'
          "MEM=$base\память кодекса" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEXDIR=$base\настройки кодекса" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python --version
          python tests\live_checks.py prepare --codex-home "$base\настройки кодекса"

      - name: Install in Russian
        shell: cmd
        run: |
          python app\setup_windows.py install --no-pause --lang ru --memory-home "%MEM%" --codex-home "%CODEXDIR%" > "%RUNNER_TEMP%\install.log" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\install.log"
          exit /b %RC%

      - name: Live checks
        shell: pwsh
        run: python tests\live_checks.py installed --lang ru --memory-home "$env:MEM" --codex-home "$env:CODEXDIR" --install-log "$env:RUNNER_TEMP\install.log" --expect-schedule --expect-history

      - name: Uninstall together with the data
        shell: cmd
        run: python "%MEM%\app\setup_windows.py" uninstall --purge --no-pause --memory-home "%MEM%" --codex-home "%CODEXDIR%"

      - name: Checks after removal
        shell: pwsh
        run: python tests\live_checks.py removed --purged --memory-home "$env:MEM" --codex-home "$env:CODEXDIR"

  linux:
    name: Linux · install.sh, ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: language from the system (English)
            flags: ''
            lang: en
            legacy: false
          - title: Russian by flag
            flags: '--lang ru'
            lang: ru
            legacy: false
          - title: memory from an older version stays Russian
            flags: ''
            lang: ru
            legacy: true
    steps:
      - uses: actions/checkout@v7

      - name: Static checks
        run: python3 tests/win_checks.py . "$RUNNER_TEMP/unit"

      - name: Translation checks
        run: python3 tests/i18n_checks.py .

      - name: Fake Codex session
        run: python3 tests/live_checks.py prepare --codex-home "$HOME/.codex"

      - name: Memory left by a version without a language choice
        if: ${{ matrix.legacy }}
        run: |
          mkdir -p "$HOME/.codex-memory"
          cp app/templates/ru/MEMORY.md "$HOME/.codex-memory/MEMORY.md"

      - name: install.sh
        run: bash install.sh --no-embeddings ${{ matrix.flags }} 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Live checks
        run: python3 tests/live_checks.py installed --lang ${{ matrix.lang }} --memory-home "$HOME/.codex-memory" --codex-home "$HOME/.codex" --install-log "$RUNNER_TEMP/install.log" --expect-history

      - name: cron tasks
        run: crontab -l || true

      - name: uninstall.sh
        run: bash "$HOME/.codex-memory/uninstall.sh"

      - name: Checks after removal
        run: python3 tests/live_checks.py removed --memory-home "$HOME/.codex-memory" --codex-home "$HOME/.codex"
